<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Reset Your Password | Fuller-Body Method</title>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="login.css"
>

</head>


<body>

<main class="auth-page">

    <div class="auth-card">

        <a
            href="index.html"
            class="auth-logo"
        >

            <img
                src="images/logo.png"
                alt="The Fuller-Body Method"
            >

        </a>


        <span class="eyebrow">
            MEMBER AREA
        </span>


        <h1>
            Forgot your password?
        </h1>


        <p>
            Enter the email you used at checkout and we'll
            send you a link to reset your password.
        </p>


        <form id="forgotForm">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                required
                placeholder="you@example.com"
            >


            <button type="submit">
                Send Reset Link
            </button>

        </form>


        <div
            id="forgotMessage"
            class="message"
        ></div>


        <div class="activate">

            <p>
                Remembered your password?
            </p>

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </div>

</main>


<script src="forgot-password.js"></script>

</body>

</html>
