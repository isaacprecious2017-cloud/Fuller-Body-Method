<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Member Login | Fuller-Body Method</title>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="login.css"
>

</head>


<body>

<main class="auth-page">

    <div class="auth-card">

        <a
            href="index.html"
            class="auth-logo"
        >

            <img
                src="images/logo.png"
                alt="The Fuller-Body Method"
            >

        </a>


        <span class="eyebrow">
            MEMBER AREA
        </span>


        <h1>
            Welcome back.
        </h1>


        <p>
            Log in to access your private Fuller-Body Method
            library.
        </p>


        <form id="loginForm">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                required
                placeholder="you@example.com"
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                placeholder="Your password"
            >


            <button type="submit">
                Login to My Library
            </button>

        </form>


        <div
            id="loginMessage"
            class="message"
        ></div>


        <p style="text-align:center;margin-top:14px;">

            <a
                href="forgot-password.html"
                style="color:#7a3155;font-weight:800;font-size:.8rem;"
            >
                Forgot your password?
            </a>

        </p>


        <div class="activate">

            <strong>
                First time here?
            </strong>

            <p>
                After your payment, activate your member account
                with the same email you used during checkout.
            </p>

            <a href="activate.html">
                Activate My Account
            </a>

        </div>

    </div>

</main>


<script src="login.js"></script>

</body>

</html>
