<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Set A New Password | Fuller-Body Method</title>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="login.css"
>

</head>


<body>

<main class="auth-page">

    <div class="auth-card">

        <a
            href="index.html"
            class="auth-logo"
        >

            <img
                src="images/logo.png"
                alt="The Fuller-Body Method"
            >

        </a>


        <span class="eyebrow">
            MEMBER AREA
        </span>


        <h1>
            Set a new password.
        </h1>


        <p>
            Choose a new password for your account below.
        </p>


        <form id="resetForm">

            <label>
                New Password
            </label>

            <input
                type="password"
                id="password"
                minlength="6"
                required
                placeholder="Create a new password"
            >


            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                minlength="6"
                required
                placeholder="Enter it again"
            >


            <button type="submit">
                Update Password
            </button>

        </form>


        <div
            id="resetMessage"
            class="message"
        ></div>


        <div class="activate">

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </div>

</main>


<script src="reset-password.js"></script>

</body>

</html>
